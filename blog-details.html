<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details</title>
    <link rel="stylesheet" href="/blogdetails.css">
</head>
<body>

    <section class="blog-details">
        <div class="container">
            <h1 id="blogTitle"></h1>
            <p id="blogDate"></p>
            <img id="blogImage" crossorigin="anonymous" src="" alt="Blog Image">
            <p id="blogDescription"></p>
            <div class="blog-links">
                <a id="blogInstagram" href="#" target="_blank">Instagram</a>
                <a id="blogLinkedIn" href="#" target="_blank">LinkedIn</a>
                <a id="blogFacebook" href="#" target="_blank">Facebook</a>
            </div>
        </div>
    </section>

    <script>
        async function fetchBlogDetails() {
            const blogId = localStorage.getItem('selectedBlogId');
            if (!blogId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                const response = await fetch(`https://api.msp-alazhar.tech/blogsClient/getById/${blogId}`);
                const blog = await response.json();

                document.getElementById('blogTitle').textContent = blog.name;
                document.getElementById('blogDate').textContent = new Date(blog.createdAt).toLocaleDateString();
                document.getElementById('blogImage').src = blog.image;
                document.getElementById('blogDescription').textContent = blog.description;

                document.getElementById('blogInstagram').href = blog.instagram || '#';
                document.getElementById('blogLinkedIn').href = blog.linkedin || '#';
                document.getElementById('blogFacebook').href = blog.facebook || '#';

            } catch (error) {
                console.error('Error fetching blog details:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchBlogDetails);
    </script>

</body>
</html>
